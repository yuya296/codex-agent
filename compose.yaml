services:
  app:
    image: ${APP_IMAGE:-codex-agent:local}
    init: true
    ipc: host
    command: ["npm", "start"]
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:?SLACK_BOT_TOKEN is required}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:?SLACK_APP_TOKEN is required}
      SLACK_AGENT_CHAT_STATUS_ENABLED: ${SLACK_AGENT_CHAT_STATUS_ENABLED:-false}
      DEBUG_SLACK_EVENTS: ${DEBUG_SLACK_EVENTS:-false}
      DEBUG_WORKER_EVENTS: ${DEBUG_WORKER_EVENTS:-false}
      DEBUG_WORKER_EVENT_DELTAS: ${DEBUG_WORKER_EVENT_DELTAS:-false}
      CODEX_HOME: ${CODEX_HOME:-/root/.codex}
      CODEX_WORKER_COMMAND: ${CODEX_WORKER_COMMAND:-codex}
      CODEX_WORKER_ARGS: ${CODEX_WORKER_ARGS:-app-server}
      CODEX_WORKER_CWD: ${CODEX_WORKER_CWD:-/app}
      WORKER_STREAM_EVENT_TIMEOUT_MS: ${WORKER_STREAM_EVENT_TIMEOUT_MS:-300000}
      SQLITE_PATH: ${SQLITE_PATH:-/data/app.sqlite}
      PORT: ${PORT:-}
      PLAYWRIGHT_AGENT_PROFILE_DIR: ${PLAYWRIGHT_AGENT_PROFILE_DIR:-/profiles/agent}
      PLAYWRIGHT_MCP_CONFIG: ${PLAYWRIGHT_MCP_CONFIG:-/run/playwright/cli.config.json}
